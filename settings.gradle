pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Allows Gradle to auto-provision required Java toolchains (e.g., Java 21 for MC 1.21+).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'minecraft-matrix-bridge'

include 'core'
include 'forge-1.18'
include 'forge-1.19'
include 'forge-1.20'
include 'forge-1.21'
include 'neoforge-1.21'
include 'forge-26'
