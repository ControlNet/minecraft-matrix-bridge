plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

base {
    archivesName = "${mod_id}-forge-1.20.x"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('forge-shared/common/src/main/java')
            srcDir rootProject.file('forge-shared/forge-1.19plus/src/main/java')
        }
        resources {
            srcDir rootProject.file('forge-shared/common/src/main/resources')
            // Include core resources (e.g., assets/* lang files) for dev runs and packaging.
            srcDir project(':core').file('src/main/resources')
        }
    }
}

ext {
    minecraft_version = '1.20.1'
    forge_version = '47.2.0'

    mapping_channel = 'official'
    mapping_version = '1.20.1'

    pack_format = 15

    minecraft_version_range = '[1.20,1.21)'
    forge_version_range = '[47,)'
    loader_version_range = '[47,)'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        server {
            workingDirectory project.file('run-systemtest')
            property 'forge.logging.console.level', 'info'
            jvmArgs '-Djna.tmpdir=./jna'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(':core')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            pack_format            : pack_format,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // Bundle core classes into the Forge jar (single-jar server install).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':core').sourceSets.main.output)

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion.get(),
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def copyCoreForRun = tasks.register('copyCoreForRun', Copy) {
    dependsOn project(':core').tasks.named('classes')
    from project(':core').sourceSets.main.output.classesDirs
    into layout.buildDirectory.dir('classes/java/main')
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        dependsOn(copyCoreForRun)
        standardInput = System.in
    }
}
