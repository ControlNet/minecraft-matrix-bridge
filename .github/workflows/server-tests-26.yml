name: Packaged 26.x compatibility

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test artifact verification
        run: python3 -m unittest discover -s scripts -p 'test_server_artifacts.py'
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path('scripts/server-test-targets.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': targets}) + '\n')
          PY

  server:
    name: ${{ matrix.module }} on MC ${{ matrix.minecraft }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-26
          path: dist
      - name: Verify and test the built JAR (no recompilation)
        env:
          MODULE: ${{ matrix.module }}
          LOADER: ${{ matrix.loader }}
        run: >-
          python3 scripts/system_test_all.py --packaged --artifact-dir dist
          --modules "$MODULE" --loader-coordinate "$LOADER" --timeout-s 600
      - name: Upload logs and artifact checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-${{ matrix.module }}-${{ matrix.minecraft }}
          path: |
            ${{ matrix.module }}/run-systemtest/${{ matrix.loader }}/installer.log
            ${{ matrix.module }}/run-systemtest/${{ matrix.loader }}/logs/*.log
            dist/SHA256SUMS.txt
