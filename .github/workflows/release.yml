name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test the release from any branch without tagging or publishing
        type: boolean
        default: false

# One release at a time; a queued run resumes from whatever the previous one published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      build: ${{ steps.plan.outputs.build }}
      resume: ${{ steps.plan.outputs.resume }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      mod_id: ${{ steps.plan.outputs.mod_id }}
      has_modrinth: ${{ steps.plan.outputs.has_modrinth }}
      has_curseforge: ${{ steps.plan.outputs.has_curseforge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test release planner
        run: python3 -m unittest discover -s scripts -p 'test_release_plan.py'
      - name: Decide whether to release (SemVer, master only, resumable)
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          git fetch --tags --force
          python3 scripts/release_plan.py

  build-26-dist:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrappers executable
        run: chmod +x ./gradlew ./gradlew-26 ./scripts/build_dist_26.sh

      - name: Build 26.x dist
        run: ./scripts/build_dist_26.sh

      - name: Upload 26.x dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-26
          path: dist/*
          if-no-files-found: error

  build-and-release:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build jars
        run: |
          chmod +x ./gradlew ./gradlew-26 ./scripts/build_dist.sh
          ./scripts/build_dist.sh --legacy-only

      - name: Upload dist for publisher jobs
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test-servers:
    needs: [plan, build-and-release, build-26-dist]
    if: ${{ needs.plan.outputs.build == 'true' }}
    uses: ./.github/workflows/server-tests.yml

  release-metadata:
    name: Resolve and validate release tags
    needs: [plan, test-servers]
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legacy: ${{ steps.metadata.outputs.legacy }}
      modern: ${{ steps.metadata.outputs.modern }}
    steps:
      - uses: actions/checkout@v7
      - name: Test release metadata resolver
        run: python3 -m unittest discover -s scripts -p 'test_release_metadata.py'
      - name: Resolve all platform tags before publishing
        id: metadata
        env:
          CHECK_MODRINTH: ${{ needs.plan.outputs.has_modrinth }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CHECK_CURSEFORGE: ${{ needs.plan.outputs.has_curseforge }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          args=()
          if [[ "$CHECK_MODRINTH" == 'true' ]]; then args+=(--check-modrinth); fi
          if [[ "$CHECK_CURSEFORGE" == 'true' ]]; then args+=(--check-curseforge); fi
          python3 scripts/release_metadata.py "${args[@]}" --server-targets scripts/server-test-targets.json --server-exclusions scripts/server-test-exclusions.json --output release-metadata.json
      - name: Save resolved release tags
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error

  # The tag and GitHub release exist before any third-party upload, so a failed
  # publisher can be finished by rerunning the workflow on the same commit.
  create-release:
    name: Create tag and GitHub release
    needs: [plan, release-metadata]
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release-metadata

      - name: Create or verify tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git fetch --tags --force
          head="$(git rev-parse HEAD)"
          if tagged="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null)"; then
            if [[ "$tagged" != "$head" ]]; then
              echo "ERROR: ${TAG} points at ${tagged}, not ${head}" >&2
              exit 1
            fi
            echo "Tag ${TAG} already points at HEAD; resuming."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.plan.outputs.make_latest }}
        run: |
          flags=(--prerelease="${PRERELEASE}" --latest="${MAKE_LATEST}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" release-metadata/release-metadata.json --clobber

  publish-github-release-26:
    name: Attach 26.x jars to GitHub release
    needs: [plan, build-26-dist, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download 26.x dist
        uses: actions/download-artifact@v8
        with:
          name: dist-26
          path: dist

      - name: Upload assets (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          MOD_ID: ${{ needs.plan.outputs.mod_id }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mv dist/SHA256SUMS.txt dist/SHA256SUMS-26.txt
          gh release upload "$TAG" --clobber \
            "dist/${MOD_ID}-forge-26.1.x-${VERSION}.jar" \
            "dist/${MOD_ID}-forge-26.2.x-${VERSION}.jar" \
            "dist/${MOD_ID}-neoforge-26.1.x-${VERSION}.jar" \
            "dist/${MOD_ID}-neoforge-26.2.x-${VERSION}.jar" \
            dist/SHA256SUMS-26.txt

  publish-github-release-legacy:
    name: Attach legacy jars to GitHub release
    needs: [plan, build-and-release, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download legacy dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload assets (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          MOD_ID: ${{ needs.plan.outputs.mod_id }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release upload "$TAG" --clobber \
            "dist/${MOD_ID}-forge-1.18.x-${VERSION}.jar" \
            "dist/${MOD_ID}-forge-1.19.x-${VERSION}.jar" \
            "dist/${MOD_ID}-forge-1.20.x-${VERSION}.jar" \
            "dist/${MOD_ID}-forge-1.21.x-${VERSION}.jar" \
            "dist/${MOD_ID}-neoforge-1.21.x-${VERSION}.jar" \
            dist/SHA256SUMS.txt

  publish-modrinth:
    name: Publish to Modrinth (${{ matrix.module }})
    needs: [plan, release-metadata, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' && needs.plan.outputs.has_modrinth == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
      EXPECTED_FILENAME: ${{ needs.plan.outputs.mod_id }}-${{ matrix.jar_suffix }}-${{ needs.plan.outputs.version }}.jar
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.legacy) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for an earlier upload of this file
        id: existing
        run: python3 scripts/release_metadata.py --find-modrinth

      - name: Download dist
        if: ${{ steps.existing.outputs.version_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish
        id: publish
        if: ${{ steps.existing.outputs.version_id == '' }}
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ env.MODRINTH_TOKEN }}
          project: ${{ env.MODRINTH_PROJECT_ID }}
          version: ${{ needs.plan.outputs.version }}
          name: "${{ needs.plan.outputs.version }} (${{ matrix.loader }} ${{ matrix.mc }})"
          channel: ${{ needs.plan.outputs.channel }}
          environment: ${{ matrix.environment }}
          changelog: "Automated release ${{ needs.plan.outputs.tag }} (${{ matrix.loader }} ${{ matrix.mc }})."
          loaders: |-
            ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          files: dist/${{ env.EXPECTED_FILENAME }}

      - name: Verify published tags
        env:
          VERSION_ID: ${{ steps.existing.outputs.version_id || steps.publish.outputs.version-id }}
          EXPECTED_GAME_VERSIONS: ${{ matrix.game_versions }}
          EXPECTED_LOADER: ${{ matrix.loader }}
          EXPECTED_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          printf 'Modrinth version ID: `%s`\n' "$VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/release_metadata.py --verify-modrinth "$VERSION_ID"

  publish-curseforge:
    name: Publish to CurseForge (${{ matrix.module }})
    needs: [plan, release-metadata, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' && needs.plan.outputs.has_curseforge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Uploads a marker asset to the GitHub release; CurseForge cannot list files with an upload token.
    permissions:
      contents: write
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      MARKER: curseforge-${{ matrix.module }}.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.legacy) }}
    steps:
      - name: Check for an earlier upload of this file
        id: existing
        run: |
          # Fail the step if the release cannot be read rather than risk a duplicate upload.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq "$MARKER" <<< "$assets"; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
            echo "Already uploaded to CurseForge (marker $MARKER); skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload
        id: publish
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ env.CURSEFORGE_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: dist/${{ needs.plan.outputs.mod_id }}-${{ matrix.jar_suffix }}-${{ needs.plan.outputs.version }}.jar
          game_versions: ${{ matrix.curseforge_ids }}
          release_type: ${{ needs.plan.outputs.channel }}
          changelog: "Automated release ${{ needs.plan.outputs.tag }}."
          changelog_type: markdown

      - name: Record uploaded file ID
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        env:
          FILE_ID: ${{ steps.publish.outputs.id }}
        run: |
          [[ "$FILE_ID" =~ ^[0-9]+$ ]]
          printf '{"file_id": %s}\n' "$FILE_ID" > "$MARKER"
          gh release upload "$TAG" "$MARKER" --clobber
          printf 'CurseForge file ID: `%s` (tags validated before upload; moderation may be pending)\n' "$FILE_ID" >> "$GITHUB_STEP_SUMMARY"

  publish-modrinth-26:
    name: Publish to Modrinth (${{ matrix.module }})
    needs: [plan, release-metadata, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' && needs.plan.outputs.has_modrinth == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
      EXPECTED_FILENAME: ${{ needs.plan.outputs.mod_id }}-${{ matrix.jar_suffix }}-${{ needs.plan.outputs.version }}.jar
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.modern) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for an earlier upload of this file
        id: existing
        run: python3 scripts/release_metadata.py --find-modrinth

      - name: Download 26.x dist
        if: ${{ steps.existing.outputs.version_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: dist-26
          path: dist

      - name: Publish
        id: publish
        if: ${{ steps.existing.outputs.version_id == '' }}
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ env.MODRINTH_TOKEN }}
          project: ${{ env.MODRINTH_PROJECT_ID }}
          version: ${{ needs.plan.outputs.version }}
          name: "${{ needs.plan.outputs.version }} (${{ matrix.loader }} ${{ matrix.mc }})"
          channel: ${{ needs.plan.outputs.channel }}
          environment: ${{ matrix.environment }}
          changelog: "Automated release ${{ needs.plan.outputs.tag }} (${{ matrix.loader }} ${{ matrix.mc }})."
          loaders: |-
            ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          files: dist/${{ env.EXPECTED_FILENAME }}

      - name: Verify published tags
        env:
          VERSION_ID: ${{ steps.existing.outputs.version_id || steps.publish.outputs.version-id }}
          EXPECTED_GAME_VERSIONS: ${{ matrix.game_versions }}
          EXPECTED_LOADER: ${{ matrix.loader }}
          EXPECTED_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          printf 'Modrinth version ID: `%s`\n' "$VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/release_metadata.py --verify-modrinth "$VERSION_ID"

  publish-curseforge-26:
    name: Publish to CurseForge (${{ matrix.module }})
    needs: [plan, release-metadata, create-release]
    if: ${{ needs.plan.outputs.should_release == 'true' && needs.plan.outputs.has_curseforge == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Uploads a marker asset to the GitHub release; CurseForge cannot list files with an upload token.
    permissions:
      contents: write
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      MARKER: curseforge-${{ matrix.module }}.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.modern) }}
    steps:
      - name: Check for an earlier upload of this file
        id: existing
        run: |
          # Fail the step if the release cannot be read rather than risk a duplicate upload.
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq "$MARKER" <<< "$assets"; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
            echo "Already uploaded to CurseForge (marker $MARKER); skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download 26.x dist
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: dist-26
          path: dist

      - name: Upload
        id: publish
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ env.CURSEFORGE_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: dist/${{ needs.plan.outputs.mod_id }}-${{ matrix.jar_suffix }}-${{ needs.plan.outputs.version }}.jar
          game_versions: ${{ matrix.curseforge_ids }}
          release_type: ${{ needs.plan.outputs.channel }}
          changelog: "Automated release ${{ needs.plan.outputs.tag }}."
          changelog_type: markdown

      - name: Record uploaded file ID
        if: ${{ steps.existing.outputs.uploaded != 'true' }}
        env:
          FILE_ID: ${{ steps.publish.outputs.id }}
        run: |
          [[ "$FILE_ID" =~ ^[0-9]+$ ]]
          printf '{"file_id": %s}\n' "$FILE_ID" > "$MARKER"
          gh release upload "$TAG" "$MARKER" --clobber
          printf 'CurseForge file ID: `%s` (tags validated before upload; moderation may be pending)\n' "$FILE_ID" >> "$GITHUB_STEP_SUMMARY"
